# Install in /etc/apache2/vhosts.d/lineclash.conf on sth-ts-web002.
# Replace the certificate paths with your real full chain and private key.
<VirtualHost *:80>
    ServerName lineclash.kladhest.se
    Redirect permanent / https://lineclash.kladhest.se/
</VirtualHost>
<VirtualHost *:443>
    ServerName lineclash.kladhest.se
    DocumentRoot /srv/www/vhosts/lineclash.kladhest.se
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl.crt/lineclash.kladhest.se-fullchain.pem
    SSLCertificateKeyFile /etc/apache2/ssl.key/lineclash.kladhest.se-key.pem
    DirectoryIndex index.php
    ErrorLog /var/log/apache2/lineclash-error.log
    CustomLog /var/log/apache2/lineclash-access.log combined
    <Directory /srv/www/vhosts/lineclash.kladhest.se>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        LimitRequestBody 2097152
    </Directory>
    <Directory /srv/www/vhosts/lineclash.kladhest.se/inc>
        Require all denied
    </Directory>
    <Directory /srv/www/vhosts/lineclash.kladhest.se/bin>
        Require all denied
    </Directory>
    <FilesMatch "(?i)^(\.?config.*\.php.*|\.env(?:\..*)?|.*\.local\.php.*)$">
        Require all denied
    </FilesMatch>
</VirtualHost>
