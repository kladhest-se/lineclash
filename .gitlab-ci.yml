# LineClash CI/CD Pipeline — monorepo
#
# Runners:
#   builder-opensuse-leap15-shell   tags: [linux, shell, opensuse]
#   builder-opensuse-leap15-docker  tags: [linux, docker, opensuse]
#   builder-macos-shell             tags: [macos, shell]
#
# Path rules: only rebuild what changed.
#   server/**  or shared/**  → server jobs
#   clients/** or shared/**  → client jobs
#   docker/**               → docker image rebuild

stages:
  - docker
  - test
  - build
  - integration-test
  - package

default:
  artifacts:
    expire_in: 7 days

# ════════════════════════════════════════════════════════════
# DOCKER STAGE
# ════════════════════════════════════════════════════════════

.docker_build:
  stage: docker
  tags: [linux, shell, opensuse]
  before_script:
    - podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  rules:
    - if: $CI_COMMIT_BRANCH
      changes: [docker/Dockerfile.leap15, docker/Dockerfile.ubuntu24]
    - when: manual
      allow_failure: true

docker:leap15:
  extends: .docker_build
  script:
    - podman build --build-arg GITLAB_HOST=gitlab.kladhest.se
        -t "$CI_REGISTRY_IMAGE/ci-leap15:latest"
        -f docker/Dockerfile.leap15 .
    - podman push "$CI_REGISTRY_IMAGE/ci-leap15:latest"

docker:ubuntu24:
  extends: .docker_build
  script:
    - podman build --build-arg GITLAB_HOST=gitlab.kladhest.se
        -t "$CI_REGISTRY_IMAGE/ci-ubuntu24:latest"
        -f docker/Dockerfile.ubuntu24 .
    - podman push "$CI_REGISTRY_IMAGE/ci-ubuntu24:latest"

# ════════════════════════════════════════════════════════════
# TEST STAGE — unit tests, all platforms
# ════════════════════════════════════════════════════════════

.unit_test:
  stage: test
  script:
    - chmod +x scripts/*.sh
    - ./scripts/run-tests.sh --unit
    - make release-tools-test

test:leap15:
  extends: .unit_test
  tags: [linux, docker, opensuse]
  image: registry.kladhest.se/kladhest/lineclash/ci-leap15:latest

test:ubuntu:
  extends: .unit_test
  tags: [linux, docker, opensuse]
  image: registry.kladhest.se/kladhest/lineclash/ci-ubuntu24:latest

test:macos:
  extends: .unit_test
  tags: [macos, shell]

# ════════════════════════════════════════════════════════════
# BUILD STAGE
# ════════════════════════════════════════════════════════════

# ── Server ───────────────────────────────────────────────────
build:server:
  stage: build
  tags: [linux, docker, opensuse]
  image: registry.kladhest.se/kladhest/lineclash/ci-leap15:latest
  rules:
    - changes: [server/**, shared/**, scripts/**, version.mk, get-version.sh, .gitlab-ci.yml]
    - when: manual
  before_script:
    - zypper install -y sqlite3-devel 2>/dev/null || true
  script:
    - chmod +x scripts/*.sh
    - ./scripts/build-server.sh
  artifacts:
    name: server-binaries
    paths:
      - server/lineclashd
      - server/lineclashd-tool
      - server/src/buildnum.h

# Server artifacts must match the packaging platform.
build:server:macos:
  extends: build:server
  tags: [macos, shell]
  image: null
  before_script: []

build:server:ubuntu:
  extends: build:server
  image: registry.kladhest.se/kladhest/lineclash/ci-ubuntu24:latest
  before_script: []

# ── GUI Client ───────────────────────────────────────────────
build:client:macos:
  stage: build
  tags: [macos, shell]
  rules:
    - changes: [clients/gui/**, clients/cli/**, shared/**, scripts/**, version.mk, get-version.sh, .gitlab-ci.yml]
    - when: manual
  script:
    - brew list sdl2 &>/dev/null || brew install sdl2
    - chmod +x scripts/*.sh
    - ./scripts/build-client.sh
  artifacts:
    name: client-macos-arm64
    paths: [clients/gui/lineclash]

build:client:leap15:
  stage: build
  tags: [linux, docker, opensuse]
  image: registry.kladhest.se/kladhest/lineclash/ci-leap15:latest
  rules:
    - changes: [clients/gui/**, clients/cli/**, shared/**, scripts/**, version.mk, get-version.sh, .gitlab-ci.yml]
    - when: manual
  script:
    - chmod +x scripts/*.sh
    - ./scripts/build-client.sh
  artifacts:
    name: client-leap15-x86_64
    paths: [clients/gui/lineclash]

build:client:ubuntu:
  stage: build
  tags: [linux, docker, opensuse]
  image: registry.kladhest.se/kladhest/lineclash/ci-ubuntu24:latest
  rules:
    - changes: [clients/gui/**, clients/cli/**, shared/**, scripts/**, version.mk, get-version.sh, .gitlab-ci.yml]
    - when: manual
  script:
    - chmod +x scripts/*.sh
    - ./scripts/build-client.sh
  artifacts:
    name: client-ubuntu-x86_64
    paths: [clients/gui/lineclash]

# ── CLI client ───────────────────────────────────────────────
build:cli:macos:
  stage: build
  tags: [macos, shell]
  rules:
    - changes: [clients/cli/**, shared/**, scripts/**, version.mk, get-version.sh, .gitlab-ci.yml]
    - when: manual
  script:
    - chmod +x scripts/*.sh
    - ./scripts/build-cli.sh
  artifacts:
    name: cli-macos-arm64
    paths: [clients/cli/lineclash-cli]

build:cli:leap15:
  stage: build
  tags: [linux, docker, opensuse]
  image: registry.kladhest.se/kladhest/lineclash/ci-leap15:latest
  rules:
    - changes: [clients/cli/**, shared/**, scripts/**, version.mk, get-version.sh, .gitlab-ci.yml]
    - when: manual
  script:
    - chmod +x scripts/*.sh
    - ./scripts/build-cli.sh
  artifacts:
    name: cli-leap15-x86_64
    paths: [clients/cli/lineclash-cli]

build:cli:ubuntu:
  stage: build
  tags: [linux, docker, opensuse]
  image: registry.kladhest.se/kladhest/lineclash/ci-ubuntu24:latest
  rules:
    - changes: [clients/cli/**, shared/**, scripts/**, version.mk, get-version.sh, .gitlab-ci.yml]
    - when: manual
  script:
    - chmod +x scripts/*.sh
    - ./scripts/build-cli.sh
  artifacts:
    name: cli-ubuntu-x86_64
    paths: [clients/cli/lineclash-cli]

# ════════════════════════════════════════════════════════════
# INTEGRATION TEST STAGE
# ════════════════════════════════════════════════════════════

.integration_test:
  stage: integration-test
  needs: []
  script:
    - chmod +x scripts/*.sh
    - ./scripts/build-server.sh
    - ./scripts/run-tests.sh --integration

integration:leap15:
  extends: .integration_test
  tags: [linux, docker, opensuse]
  image: registry.kladhest.se/kladhest/lineclash/ci-leap15:latest

integration:ubuntu:
  extends: .integration_test
  tags: [linux, docker, opensuse]
  image: registry.kladhest.se/kladhest/lineclash/ci-ubuntu24:latest

integration:macos:
  extends: .integration_test
  tags: [macos, shell]

# ════════════════════════════════════════════════════════════
# PACKAGE STAGE
# ════════════════════════════════════════════════════════════

package:macos:
  stage: package
  tags: [macos, shell]
  needs:
    - build:client:macos
    - build:cli:macos
    - build:server:macos
    - integration:macos
    - verify:macos
  script:
    - chmod +x scripts/*.sh
    - ./scripts/package-macos.sh
  artifacts:
    name: "lineclash-macos-arm64-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/LineClash-*-macos-arm64.dmg

package:leap15:
  stage: package
  tags: [linux, docker, opensuse]
  image: registry.kladhest.se/kladhest/lineclash/ci-leap15:latest
  needs:
    - build:client:leap15
    - build:cli:leap15
    - build:server
    - integration:leap15
    - verify:leap15
  script:
    - chmod +x scripts/*.sh
    - ./scripts/package-linux.sh --opensuse-leap15
  artifacts:
    name: "lineclash-leap15-x86_64-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/LineClash-*-linux-x86_64.tar.gz
      - dist/lineclash-*opensuse-leap15*.rpm

package:ubuntu:
  stage: package
  tags: [linux, docker, opensuse]
  image: registry.kladhest.se/kladhest/lineclash/ci-ubuntu24:latest
  needs:
    - build:client:ubuntu
    - build:cli:ubuntu
    - build:server:ubuntu
    - integration:ubuntu
    - verify:ubuntu
  script:
    - chmod +x scripts/*.sh
    - ./scripts/package-linux.sh --deb
  artifacts:
    name: "lineclash-ubuntu24-x86_64-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/lineclash_*.deb

# Native verification is an explicit release gate. The Windows runner uses
# MSYS2 UCRT64 Bash; install compiler, make, SDL2, SQLite and Python beforehand.
.platform_verification:
  stage: integration-test
  needs: []
  script:
    - bash scripts/verify-platform.sh
  artifacts:
    when: always
    paths: [dist/verification/]

verify:macos:
  extends: .platform_verification
  tags: [macos, shell]

verify:ubuntu:
  extends: .platform_verification
  tags: [linux, docker, opensuse]
  image: registry.kladhest.se/kladhest/lineclash/ci-ubuntu24:latest

verify:leap15:
  extends: .platform_verification
  tags: [linux, docker, opensuse]
  image: registry.kladhest.se/kladhest/lineclash/ci-leap15:latest

verify:windows:
  variables:
    LINECLASH_MSYS2_ROOT: 'C:\msys64'
  script:
    - |
      & "$env:LINECLASH_MSYS2_ROOT\usr\bin\bash.exe" -lc 'export PATH=/ucrt64/bin:/usr/bin:$PATH; cd "$(cygpath -u "$CI_PROJECT_DIR")"; bash scripts/verify-platform.sh'
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  rules:
    - if: '$LINECLASH_WINDOWS_RUNNER == "1"'
    - when: never
  extends: .platform_verification
  tags: [windows, msys2]

# Real database integration; independent of native game-platform jobs.
test:web-directory:
  stage: test
  tags: [linux, docker, opensuse]
  image: php:8.3-cli
  services:
    - name: mariadb:10.11
      alias: mariadb
  variables:
    MYSQL_DATABASE: lineclash_test
    MYSQL_ROOT_PASSWORD: lineclash-disposable-ci
    MYSQL_ROOT_HOST: "%"
    LINECLASH_WEB_CONFIG: /tmp/lineclash-web.php
  before_script:
    - apt-get update && apt-get install -y python3 make gcc libsqlite3-dev
    - docker-php-ext-install pdo_mysql
    - cp tests/web-config.ci.php /tmp/lineclash-web.php
  script:
    - |
      php -r 'require "public-web/inc/service.php"; for ($i=0;$i<60;$i++) { try { database()->query("SELECT 1"); exit(0); } catch(Throwable $e) { usleep(500000); } } exit(1);'
    - find public-web -name '*.php' -exec php -l {} \;
    - python3 tests/test_web_refresh.py
    - make directory-test web-test
