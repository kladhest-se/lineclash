name: Windows x64
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-python
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install MSI build tool
        shell: pwsh
        run: dotnet tool install --global wix --version 4.0.6
      - name: Verify and build Windows ZIP and MSI
        run: python scripts/release.py build --config examples/release-config.json
      - name: Test extracted ZIP without the MSYS2 runtime path
        run: python scripts/smoke_package.py outputs/artifacts/LineClash-$(sh get-version.sh)-windows-$(python -c 'import platform; print(platform.machine())').zip
      - name: Verify MSI installation and removal
        shell: pwsh
        run: |
          $msi = (Get-ChildItem outputs/artifacts/*.msi).FullName
          $install = Start-Process msiexec -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -notin @(0,3010)) { throw "MSI install failed: $($install.ExitCode)" }
          try {
            $env:SDL_VIDEODRIVER = 'dummy'
            $env:SDL_AUDIODRIVER = 'dummy'
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            & "$env:ProgramFiles\LineClash\bin\lineclashd.exe" --version
            if ($LASTEXITCODE -ne 0) { throw 'Installed server failed' }
            & "$env:ProgramFiles\LineClash\bin\lineclash.exe" --smoke-test
            if ($LASTEXITCODE -ne 0) { throw 'Installed game failed' }
          } finally {
            $remove = Start-Process msiexec -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
            if ($remove.ExitCode -notin @(0,3010)) { throw "MSI removal failed: $($remove.ExitCode)" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lineclash-windows-x64
          path: |
            dist/verification/
            outputs/artifacts/LineClash-*.zip
            outputs/artifacts/LineClash-*.msi
            outputs/artifacts/SHA256SUMS
          if-no-files-found: error
