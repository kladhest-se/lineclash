name: Windows x64
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-python
      - name: Build and verify native Windows executables
        run: PYTHON=python bash scripts/verify-platform.sh
      - name: Bundle portable Windows ZIP
        run: python scripts/package-windows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lineclash-windows-x64
          path: |
            dist/verification/
            dist/LineClash-*-windows-x86_64.zip
          if-no-files-found: error
